<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI 老板绩效考核报告</title>
<style>
@font-face{
  font-family:"Inter";
  src:url("fonts/Inter-ExtraBold.woff2") format("woff2");
  font-weight:800;
  font-style:normal;
  font-display:block;
}
:root{
  --accent:#146044;
  --card:#E6F0E9;
  --ink:#22211E;
  --muted:#646159;
  --bar:#45443E;
  --track:#E4E0D6;
  --dash:#ADA89C;
  --hair:#D9D5CB;
  --paper:#F9F7F1;
  --body:#42413B;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1400px;height:1980px;background:var(--paper)}
body{
  position:relative;overflow:hidden;color:var(--ink);background:var(--paper);
  font-family:var(--sans);font-weight:400;
  -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;
}
.topbar{position:absolute;left:0;right:0;top:0;height:12px;background:var(--accent)}
h1{
  position:absolute;left:88px;top:98px;
  font-size:86px;line-height:1;font-weight:600;letter-spacing:1.15px;
}
.meta{
  position:absolute;left:88px;top:216px;max-width:880px;
  font-size:30px;line-height:36px;color:var(--muted);font-weight:400;letter-spacing:0.3px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.badge{
  position:absolute;top:208px;right:88px;height:56px;max-width:320px;
  padding:0 52px 0 26px;border-radius:28px;
  background:var(--card);color:var(--accent);
  display:flex;align-items:center;gap:12px;
  font-size:26px;font-weight:600;letter-spacing:1px;
  overflow:hidden;
}
.badge i{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none}
.badge span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hero{
  position:absolute;left:88px;top:312px;width:1224px;height:332px;
  background:var(--card);border-radius:16px;
}
.grade{
  position:absolute;left:34px;top:78px;
  font-family:Inter,sans-serif;font-weight:800;font-size:200px;line-height:0.74;
  color:var(--accent);letter-spacing:-2px;
}
.score{position:absolute;left:248px;top:60px;width:320px}
.kicker{font-size:29px;line-height:32px;font-weight:600;letter-spacing:0.4px}
.kicker.accent{color:var(--accent);display:flex;align-items:baseline;gap:22px;letter-spacing:0;margin-left:6px}
.kicker.muted{color:var(--muted);font-weight:600;letter-spacing:0.4px}
.scoreline{margin-top:39px;display:flex;align-items:baseline;gap:20px}
.scoreline b{
  font-family:Inter,sans-serif;font-weight:800;font-size:100px;line-height:0.75;
  letter-spacing:5.8px;color:var(--ink);
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
}
.scoreline b.dash{color:#6E6A62;letter-spacing:0;font-variant-numeric:normal}
.unit{display:inline-flex;align-items:baseline;gap:13px;font-size:26px;line-height:1;font-weight:500;color:var(--body);letter-spacing:0}
.unit .ud{font-family:Inter,sans-serif;font-weight:800;font-size:29px;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:0}
.few{margin-top:18px;font-size:20px;line-height:28px;color:var(--muted);font-weight:400}
.vrule{position:absolute;left:576px;top:48px;width:2px;height:236px;background:var(--hair)}
.portrait{position:absolute;left:616px;top:54px;width:560px}
.portrait h2{
  margin-top:24px;color:var(--accent);
  font-size:50px;line-height:54px;font-weight:600;letter-spacing:0.2px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.portrait p{
  margin-top:22px;width:560px;max-height:108px;
  font-size:34px;line-height:54px;font-weight:400;color:var(--body);
  white-space:pre-line;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
}
.head h2{
  position:absolute;left:88px;top:708px;
  font-size:46px;line-height:52px;font-weight:600;letter-spacing:0.4px;
}
.head .count{
  position:absolute;right:88px;top:732px;
  font-size:26px;line-height:32px;color:var(--muted);font-weight:400;
}
.hrule{position:absolute;left:88px;top:790px;width:1224px;height:3px;background:var(--ink)}
.grid{
  position:absolute;left:88px;top:817px;width:1224px;
  display:grid;grid-template-columns:586px 586px;column-gap:52px;
  grid-template-rows:repeat(4,86px);grid-auto-flow:column;
}
.cell{height:86px}
.nrow{height:34px;display:flex;align-items:flex-end;justify-content:space-between}
.nrow .n{font-size:32px;line-height:34px;font-weight:600;letter-spacing:0.2px}
.nrow .g{font-family:Inter,var(--sans);font-size:34px;line-height:34px;font-weight:800}
.nrow .g.na{font-family:var(--sans);font-size:26px;line-height:28px;font-weight:400;color:var(--muted);padding-bottom:1px}
.cell.na .n{color:var(--muted)}
.cell.low .n,.cell.low .g{color:var(--accent)}
.bar{margin-top:15px;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:6px;border-radius:3px;background:var(--bar);min-width:6px}
.cell.low .bar i{background:var(--accent)}
.bar.na{background:none;overflow:visible;position:relative}
.bar.na::after{
  content:"";position:absolute;left:0;right:0;top:2px;height:2px;
  background:repeating-linear-gradient(90deg,var(--dash) 0 6px,transparent 6px 14px);
}
.comm-lab{position:absolute;left:88px;top:1210px;font-size:46px;line-height:52px;font-weight:600;letter-spacing:0.4px}
.comm{
  position:absolute;left:88px;top:1290px;width:1224px;max-height:192px;
  font-size:38px;line-height:64px;font-weight:400;color:var(--body);
  overflow-wrap:anywhere;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;
}
.bottom{position:absolute;left:88px;top:1530px;width:1224px;display:flex;gap:86px;align-items:flex-start}
.practice{
  margin-top:8px;width:812px;height:316px;background:var(--card);border-radius:16px;
  position:relative;padding:38px 56px 32px 40px;min-width:0;overflow:hidden;
}
.practice .accent{
  position:absolute;left:0;top:31px;width:6px;height:254px;background:var(--accent);
  border-radius:0 3px 3px 0;
}
.practice .lab{font-size:26px;line-height:32px;font-weight:600;color:var(--accent)}
.practice h3{
  margin-top:16px;font-size:50px;line-height:58px;font-weight:600;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.practice .script{
  margin-top:20px;width:710px;max-height:108px;
  font-size:32px;line-height:54px;font-weight:400;color:var(--body);
  overflow-wrap:anywhere;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
}
.qrcol{width:280px;flex:none}
.qrcard{
  width:280px;height:280px;background:#fff;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
}
.qrcard img{width:256px;height:256px;display:block}
.qrcap{
  margin-top:18px;margin-left:-40px;width:360px;
  text-align:center;font-size:22px;line-height:28px;color:var(--muted);white-space:nowrap;
}
.fline{position:absolute;left:88px;top:1896px;width:1224px;height:2px;background:var(--hair)}
.foot{position:absolute;left:88px;top:1922px;font-size:24px;line-height:30px;color:var(--muted)}
</style>
</head>
<body>
<div class="topbar"></div>
<h1>AI 老板绩效考核报告</h1>
<div class="meta" id="meta"></div>
<div class="badge" id="badge"><i></i><span id="badgeText"></span></div>

<section class="hero">
  <div class="grade" id="grade"></div>
  <div class="score">
    <div class="kicker accent"><span>总评</span><span>/</span><span>平均分</span></div>
    <div class="scoreline"><b id="avg"></b><span class="unit"><span>分</span><span>/</span><span class="ud">100</span></span></div>
    <div class="few" id="few" hidden>计分项偏少，仅供参考</div>
  </div>
  <div class="vrule"></div>
  <div class="portrait">
    <div class="kicker muted">老板画像</div>
    <h2 id="portraitTitle"></h2>
    <p id="portraitText"></p>
  </div>
</section>

<div class="head">
  <h2>分项评分</h2>
  <div class="count" id="count"></div>
</div>
<div class="hrule"></div>
<div class="grid" id="grid"></div>

<div class="comm-lab">总评语</div>
<p class="comm" id="comm"></p>

<div class="bottom">
  <div class="practice">
    <div class="accent"></div>
    <div class="lab">下周只练这一个</div>
    <h3 id="focusTitle"></h3>
    <p class="script" id="focusScript"></p>
  </div>
  <div class="qrcol">
    <div class="qrcard"><img src="qr.png" alt="BitPan.AI 小红书二维码"></div>
    <div class="qrcap">关注 BitPan.AI 获取更多 AI 资讯</div>
  </div>
</div>
<div class="fline"></div>
<div class="foot">本报告由 AI 根据对话记录生成，仅供娱乐和自我改进</div>

<textarea id="report-data" hidden readonly>
const REPORT = {
  "date": "2026年11月9日",
  "conversations": 23,
  "badge": "示例数据",
  "grades": {
    "交代任务": "A",
    "给参考样例": "A",
    "先问后做": "B",
    "验收再收": "B",
    "拆任务": "A",
    "反馈具体": "A",
    "放手程度": "A",
    "把纠错变成规矩": null
  },
  "portraitTitle": "给方向也给空间",
  "portraitText": "开工前把方向讲清楚，执行时放手，关键节点再一起确认。",
  "commentary": "目标、用途和参考都到位，AI 一开工就知道往哪走。任务拆得清楚，反馈也能落到具体改动。下次可以在验收后记下一条可复用的标准，省掉下一轮重复沟通。",
  "focusTitle": "把反馈沉淀成规则",
  "focusScript": "「这次通过的标准是 X。把它补进检查清单，下次交付前先自查。」"
};
</textarea>
<script>
window.addEventListener("error", (ev) => {
  document.body.dataset.renderError = (ev && ev.message) || "脚本出错";
});
</script>
<script>
/* =====================================================================
   只改上面 textarea 里的 REPORT。主题色、平均分、总评等级、最低项高亮、
   进度条都由脚本计算，不要手填，也不要改样式。数据按纯文本读入，再用
   textContent 写到页面上，不会当成 HTML 执行。
   字数是上限。再长会被省略号截断，不要指望多写还能完整显示。
   date            日期，原样显示，最多 16 个字。如 "2026年11月9日"
   conversations   对话段数，最多 4 位整数。缺 date 或 conversations 时那一段留空
   badge           右上角胶囊，最多 6 个字。示例填 "示例数据"；真实报告填 null 去掉
   grades          八项等级：A–F，不区分大小写。证据不足填 null。别的值会报错
   portraitTitle   老板画像标题，一行，最多 11 个字
   portraitText    画像描述，最多 32 个字、两行。\n 用来手动断行，每一段必须单独排进一行
   commentary      总评语，最多 90 个字、三行
   focusTitle      下周只练这一个的标题，一行，最多 14 个字
   focusScript     一句可以照着说的话，连同「」一起写，最多 42 个字、两行
   ===================================================================== */
function loadReport(){
  const raw = document.getElementById("report-data").textContent.trim();
  const m = raw.match(/^const REPORT\s*=\s*(\{[\s\S]*\})\s*;?$/);
  if (!m) throw new Error("脚本出错：找不到 REPORT");
  try { return JSON.parse(m[1]); }
  catch (err) { throw new Error("脚本出错：" + (err && err.message ? err.message : err)); }
}
const ORDER = ["交代任务","给参考样例","先问后做","验收再收","拆任务","反馈具体","放手程度","把纠错变成规矩"];
const HALF = {A:200, B:150, C:100, D:50, E:25, F:0};
const SCORE = {A:100, B:75, C:50, D:25, E:12.5, F:0};
const THEME = {
  A: {accent:"#146044", card:"#E6F0E9"},
  B: {accent:"#46651F", card:"#ECF0E2"},
  C: {accent:"#8A5A06", card:"#F7EED8"},
  D: {accent:"#A84718", card:"#F7E8DE"},
  E: {accent:"#A5372F", card:"#F7E5E2"},
  "?": {accent:"#6E6A62", card:"#EEECE6"}
};

function roundHalfUp(halfSum, n){
  return Math.floor((halfSum + n) / (2 * n));
}
function overallOf(score){
  if (score >= 88) return "A";
  if (score >= 63) return "B";
  if (score >= 45) return "C";
  if (score >= 20) return "D";
  return "E";
}
function normalizeGrade(g, item){
  if (g === null || g === undefined) return null;
  if (typeof g !== "string"){
    throw new Error("「" + item + "」的等级必须是 A–F 或 null，得到 " + JSON.stringify(g));
  }
  const u = g.trim().toUpperCase();
  if (!Object.prototype.hasOwnProperty.call(SCORE, u)){
    throw new Error("「" + item + "」的等级「" + g + "」无法识别，只能是 A–F 或 null");
  }
  return u;
}
function compute(report){
  const grades = report.grades || {};
  const normalized = {};
  let half = 0, scored = 0, na = 0;
  let worst = null, worstName = null;
  const seen = [];
  for (const name of ORDER){
    const raw = Object.prototype.hasOwnProperty.call(grades, name) ? grades[name] : null;
    const g = normalizeGrade(raw, name);
    normalized[name] = g;
    if (g === null){ na++; continue; }
    scored++;
    seen.push(g);
    half += HALF[g];
    const s = SCORE[g];
    if (worst === null || s < worst){ worst = s; worstName = name; }
  }
  if (seen.length && seen.every(x => x === seen[0])) worstName = null;
  const avg = scored ? roundHalfUp(half, scored) : null;
  const overall = na * 2 > ORDER.length ? "?" : (avg === null ? "?" : overallOf(avg));
  return {avg, overall, scored, na, worstName, grades: normalized};
}
function metaText(report){
  const parts = [];
  if (report.date !== null && report.date !== undefined && String(report.date).trim() !== ""){
    parts.push(String(report.date).trim());
  }
  const c = report.conversations;
  if (c !== null && c !== undefined && c !== "") parts.push("基于 " + c + " 段对话");
  return parts.join(" · ");
}
function fillText(id, value){
  document.getElementById(id).textContent = value == null ? "" : String(value);
}
function assertPortraitLines(text){
  const value = text == null ? "" : String(text);
  if (!value.includes("\n")) return;
  const parts = value.split("\n");
  const el = document.getElementById("portraitText");
  if (parts.length > 2){
    throw new Error("portraitText 排成了 " + parts.length + " 行，最多两行");
  }
  const cs = getComputedStyle(el);
  const probe = document.createElement("span");
  probe.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;font:" + cs.font + ";letter-spacing:" + cs.letterSpacing;
  document.body.appendChild(probe);
  try {
    for (const part of parts){
      probe.textContent = part;
      if (probe.getBoundingClientRect().width > el.clientWidth + 1){
        throw new Error("portraitText 有一段排不进一行，换行后会超过两行");
      }
    }
  } finally {
    probe.remove();
  }
}

(function(){
  const R = loadReport();
  const C = compute(R);
  const theme = THEME[C.overall] || THEME["?"];
  const root = document.documentElement;
  root.style.setProperty("--accent", theme.accent);
  root.style.setProperty("--card", theme.card);

  document.getElementById("meta").textContent = metaText(R);
  const badge = document.getElementById("badge");
  if (R.badge) document.getElementById("badgeText").textContent = String(R.badge);
  else badge.style.display = "none";

  document.getElementById("grade").textContent = C.overall;
  const avgEl = document.getElementById("avg");
  if (C.overall === "?"){
    avgEl.textContent = "—";
    avgEl.classList.add("dash");
  } else {
    avgEl.textContent = String(C.avg);
    avgEl.classList.remove("dash");
  }
  document.getElementById("few").hidden = !(C.scored < 5);
  fillText("portraitTitle", R.portraitTitle);
  fillText("portraitText", R.portraitText);
  document.getElementById("count").textContent = `${C.scored} 项计分 · ${C.na} 项待观察`;
  fillText("comm", R.commentary);
  fillText("focusTitle", R.focusTitle);
  fillText("focusScript", R.focusScript);

  const grid = document.getElementById("grid");
  grid.replaceChildren();
  for (const name of ORDER){
    const g = C.grades[name];
    const cell = document.createElement("div");
    const low = g !== null && name === C.worstName;
    cell.className = "cell" + (g === null ? " na" : low ? " low" : "");
    const nrow = document.createElement("div");
    nrow.className = "nrow";
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = name;
    const grade = document.createElement("span");
    grade.className = g === null ? "g na" : "g";
    grade.textContent = g === null ? "证据不足" : g;
    nrow.append(n, grade);
    const bar = document.createElement("div");
    if (g === null){
      bar.className = "bar na";
    } else {
      bar.className = "bar";
      const i = document.createElement("i");
      i.style.width = SCORE[g] + "%";
      bar.append(i);
    }
    cell.append(nrow, bar);
    grid.append(cell);
  }

  document.body.dataset.overall = C.overall;
  document.body.dataset.avg = C.avg === null ? "" : String(C.avg);
  document.body.dataset.low = C.worstName || "";
  document.body.dataset.scored = String(C.scored);
  document.body.dataset.na = String(C.na);
  assertPortraitLines(R.portraitText);
  document.body.dataset.rendered = "ok";
})();
</script>
</body>
</html>
